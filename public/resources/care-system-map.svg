<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>How care moves through the health system</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F9F7F1" stroke="none" stroke-width="1"/><text x="48" y="44" text-anchor="start" font-family="Liberation Sans" font-size="17" fill="#126E65" font-weight="700">IIM LUCKNOW   /   DIGITAL TRANSFORMATION AND INNOVATION IN HEALTHCARE</text><text x="48" y="108" text-anchor="start" font-family="Liberation Serif" font-size="62" fill="#173633" font-weight="400">How care moves through the health system</text><text x="48" y="151" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#48605B" font-weight="400">Follow one patient across the middle. At each handoff, ask who needs what information to act.</text><line x1="50" y1="189" x2="91" y2="189" stroke="#126E65" stroke-width="5" stroke-dasharray="none"/><polygon fill="#126E65" points="91.00,189.00 81.24,194.08 81.24,183.92"/><text x="103" y="195" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Care journey</text><line x1="261" y1="189" x2="308" y2="189" stroke="#325E86" stroke-width="2" stroke-dasharray="5 4"/><polygon fill="#325E86" points="308.00,189.00 298.24,194.08 298.24,183.92"/><polygon fill="#325E86" points="261.00,189.00 270.76,183.92 270.76,194.08"/><text x="321" y="195" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Information exchanged</text><text x="1549" y="195" text-anchor="end" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Ten stakeholder views, each anchored at one decision</text><rect x="48" y="225" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="63" y="257" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Clinics &amp; primary care</text><text x="63" y="284" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Outreach and local visits</text><rect x="48" y="578" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="63" y="610" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Healthcare IT</text><text x="63" y="637" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Records, identity, consent</text><line x1="78" y1="311" x2="78" y2="383" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="78.00,383.00 72.92,373.24 83.08,373.24"/><polygon fill="#325E86" points="78.00,311.00 83.08,320.76 72.92,320.76"/><text x="93" y="341" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Symptoms</text><text x="93" y="366" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Visit options</text><line x1="78" y1="497" x2="78" y2="569" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="78.00,569.00 72.92,559.24 83.08,559.24"/><polygon fill="#325E86" points="78.00,497.00 83.08,506.76 72.92,506.76"/><text x="93" y="527" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Consent</text><text x="93" y="552" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Prior record</text><rect x="48" y="388" width="286" height="98" rx="10" fill="#126E65" stroke="none" stroke-width="1"/><text x="64" y="428" text-anchor="start" font-family="Liberation Sans" font-size="31" fill="#FFFFFF" font-weight="700">Reach care</text><text x="64" y="462" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#F1FFFB" font-weight="400">Prevention or first contact</text><line x1="334" y1="438" x2="350" y2="438" stroke="#126E65" stroke-width="5" stroke-dasharray="none"/><polygon fill="#126E65" points="350.00,438.00 340.24,443.08 340.24,432.92"/><rect x="352" y="225" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="367" y="257" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Health workers</text><text x="367" y="284" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Doctors, nurses, allied staff</text><rect x="352" y="578" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="367" y="610" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Insurance &amp; payers</text><text x="367" y="637" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Coverage and claims</text><line x1="382" y1="311" x2="382" y2="383" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="382.00,383.00 376.92,373.24 387.08,373.24"/><polygon fill="#325E86" points="382.00,311.00 387.08,320.76 376.92,320.76"/><text x="397" y="341" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ History</text><text x="397" y="366" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Referral</text><line x1="382" y1="497" x2="382" y2="569" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="382.00,569.00 376.92,559.24 387.08,559.24"/><polygon fill="#325E86" points="382.00,497.00 387.08,506.76 376.92,506.76"/><text x="397" y="527" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Coverage query</text><text x="397" y="552" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Payer decision</text><rect x="352" y="388" width="286" height="98" rx="10" fill="#126E65" stroke="none" stroke-width="1"/><text x="368" y="428" text-anchor="start" font-family="Liberation Sans" font-size="31" fill="#FFFFFF" font-weight="700">Assess &amp; refer</text><text x="368" y="462" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#F1FFFB" font-weight="400">Decide what is needed</text><line x1="638" y1="438" x2="654" y2="438" stroke="#126E65" stroke-width="5" stroke-dasharray="none"/><polygon fill="#126E65" points="654.00,438.00 644.24,443.08 644.24,432.92"/><rect x="656" y="225" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="671" y="257" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Diagnostics</text><text x="671" y="284" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Blood work, imaging, genetics</text><rect x="656" y="578" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="671" y="610" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Consumables</text><text x="671" y="637" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Stores, reagents, sutures</text><line x1="686" y1="311" x2="686" y2="383" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="686.00,383.00 680.92,373.24 691.08,373.24"/><polygon fill="#325E86" points="686.00,311.00 691.08,320.76 680.92,320.76"/><text x="701" y="341" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Test order</text><text x="701" y="366" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Result</text><line x1="686" y1="497" x2="686" y2="569" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="686.00,569.00 680.92,559.24 691.08,559.24"/><polygon fill="#325E86" points="686.00,497.00 691.08,506.76 680.92,506.76"/><text x="701" y="527" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Stock request</text><text x="701" y="552" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Availability</text><rect x="656" y="388" width="286" height="98" rx="10" fill="#126E65" stroke="none" stroke-width="1"/><text x="672" y="428" text-anchor="start" font-family="Liberation Sans" font-size="31" fill="#FFFFFF" font-weight="700">Investigate</text><text x="672" y="462" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#F1FFFB" font-weight="400">Explain the findings</text><line x1="942" y1="438" x2="958" y2="438" stroke="#126E65" stroke-width="5" stroke-dasharray="none"/><polygon fill="#126E65" points="958.00,438.00 948.24,443.08 948.24,432.92"/><rect x="960" y="225" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="975" y="257" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Hospitals</text><text x="975" y="284" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Referral and inpatient care</text><rect x="960" y="578" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="975" y="610" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Pharma &amp; medicines</text><text x="975" y="637" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Manufacturers, pharmacies</text><line x1="990" y1="311" x2="990" y2="383" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="990.00,383.00 984.92,373.24 995.08,373.24"/><polygon fill="#325E86" points="990.00,311.00 995.08,320.76 984.92,320.76"/><text x="1005" y="341" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Care plan</text><text x="1005" y="366" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Discharge note</text><line x1="990" y1="497" x2="990" y2="569" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="990.00,569.00 984.92,559.24 995.08,559.24"/><polygon fill="#325E86" points="990.00,497.00 995.08,506.76 984.92,506.76"/><text x="1005" y="527" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Prescription</text><text x="1005" y="552" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Dispensing record</text><rect x="960" y="388" width="286" height="98" rx="10" fill="#126E65" stroke="none" stroke-width="1"/><text x="976" y="428" text-anchor="start" font-family="Liberation Sans" font-size="31" fill="#FFFFFF" font-weight="700">Agree &amp; treat</text><text x="976" y="462" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#F1FFFB" font-weight="400">Deliver the agreed care</text><line x1="1246" y1="438" x2="1262" y2="438" stroke="#126E65" stroke-width="5" stroke-dasharray="none"/><polygon fill="#126E65" points="1262.00,438.00 1252.24,443.08 1252.24,432.92"/><rect x="1264" y="225" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="1279" y="257" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Patients &amp; caregivers</text><text x="1279" y="284" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Daily care and preferences</text><rect x="1264" y="578" width="286" height="79" rx="9" fill="#FFFFFF" stroke="#BBCAC1" stroke-width="1.6"/><text x="1279" y="610" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">Medtech</text><text x="1279" y="637" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#48605B" font-weight="400">Devices and test kits</text><line x1="1294" y1="311" x2="1294" y2="383" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="1294.00,383.00 1288.92,373.24 1299.08,373.24"/><polygon fill="#325E86" points="1294.00,311.00 1299.08,320.76 1288.92,320.76"/><text x="1309" y="341" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Instructions</text><text x="1309" y="366" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Home concerns</text><line x1="1294" y1="497" x2="1294" y2="569" stroke="#325E86" stroke-width="2.5" stroke-dasharray="6 4"/><polygon fill="#325E86" points="1294.00,569.00 1288.92,559.24 1299.08,559.24"/><polygon fill="#325E86" points="1294.00,497.00 1299.08,506.76 1288.92,506.76"/><text x="1309" y="527" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↓ Monitoring request</text><text x="1309" y="552" text-anchor="start" font-family="Liberation Sans" font-size="19" fill="#325E86" font-weight="400">↑ Reading or alert</text><rect x="1264" y="388" width="286" height="98" rx="10" fill="#126E65" stroke="none" stroke-width="1"/><text x="1280" y="428" text-anchor="start" font-family="Liberation Sans" font-size="31" fill="#FFFFFF" font-weight="700">Recover &amp; review</text><text x="1280" y="462" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#F1FFFB" font-weight="400">At home or on the ward</text><line x1="1550" y1="438" x2="1571" y2="438" stroke="#325E86" stroke-width="2" stroke-dasharray="6 4"/><line x1="1571" y1="438" x2="1571" y2="688" stroke="#325E86" stroke-width="2" stroke-dasharray="6 4"/><line x1="1571" y1="688" x2="345" y2="688" stroke="#325E86" stroke-width="2" stroke-dasharray="6 4"/><line x1="345" y1="688" x2="345" y2="470" stroke="#325E86" stroke-width="2" stroke-dasharray="6 4"/><line x1="345" y1="470" x2="354" y2="470" stroke="#325E86" stroke-width="2" stroke-dasharray="none"/><polygon fill="#325E86" points="354.00,470.00 344.24,475.08 344.24,464.92"/><rect x="513" y="670" width="897" height="35" rx="0" fill="#F9F7F1" stroke="none" stroke-width="1"/><text x="960" y="695" text-anchor="middle" font-family="Liberation Sans" font-size="22" fill="#325E86" font-weight="700">New symptoms, a missed visit or an adverse event can trigger reassessment</text><rect x="48" y="726" width="1502" height="108" rx="10" fill="#F4E3D7" stroke="none" stroke-width="1"/><text x="67" y="755" text-anchor="start" font-family="Liberation Sans" font-size="17" fill="#A34A2D" font-weight="700">HANDOFFS TO INVESTIGATE</text><text x="69" y="788" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">A referral goes unbooked</text><text x="69" y="817" text-anchor="start" font-family="Liberation Sans" font-size="21" fill="#48605B" font-weight="400">Who follows up with the patient?</text><text x="555" y="788" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">A result goes unread</text><text x="555" y="817" text-anchor="start" font-family="Liberation Sans" font-size="21" fill="#48605B" font-weight="400">Who acknowledges it and acts?</text><text x="1040" y="788" text-anchor="start" font-family="Liberation Sans" font-size="25" fill="#173633" font-weight="700">The plan changes at home</text><text x="1040" y="817" text-anchor="start" font-family="Liberation Sans" font-size="21" fill="#48605B" font-weight="400">Who updates the caregiver?</text><text x="48" y="875" text-anchor="start" font-family="Liberation Sans" font-size="18" fill="#48605B" font-weight="400">Illustrative journey. A patient may enter at any stage, skip a test or return to an earlier decision.</text><text x="1550" y="875" text-anchor="end" font-family="Liberation Sans" font-size="18" fill="#48605B" font-weight="400">Sachin Gaur   /   29 November 2026</text></svg>